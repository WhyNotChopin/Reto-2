<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="css/styles.min.css">
</head>
<body>
    <div class="contenedor">
        <header>
            <h1>Calculadora de Índice de Masa Corporal</h1>
            <p class="subtitulo">Conoce tu estado de salud de forma rápida y sencilla</p>
        </header>

        <main>
            <form id="formulario-imc" class="formulario">
                <div class="campo">
                    <label for="peso">Peso (kg)</label>
                    <input type="number" id="peso" name="peso" min="20" max="300" step="0.1" placeholder="Ejemplo: 70.5" required>
                </div>
                <div class="campo">
                    <label for="altura">Altura (cm)</label>
                    <input type="number" id="altura" name="altura" min="100" max="250" step="1" placeholder="Ejemplo: 175" required>
                </div>
                <button type="submit" class="boton">Calcular IMC</button>
            </form>

            <div id="resultado" class="resultado oculto">
                <h2>Tu resultado</h2>
                <p class="valor-imc">IMC: <span id="valor"></span></p>
                <p class="categoria" id="categoria"></p>
                <p class="recomendacion" id="recomendacion"></p>
            </div>
        </main>

        <footer>
            <p>Herramienta educativa · No sustituye consulta médica</p>
        </footer>
    </div>
    <script src="js/app.min.js"></script>
</body>
</html>
